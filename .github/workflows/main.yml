
name: Feane Project CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout GitHub repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Build Docker image
      - name: Build Docker Image
        run: |
          docker build \
            -t feane-project:${{ github.sha }} \
            ./feane-1.0.0

      # Step 3: Deploy application to AWS EC2
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e

            echo "Starting deployment..."

            # Clone repository if not available
            if [ ! -d /opt/Feane_project/.git ]; then
              sudo git clone https://github.com/Swatik2003/Feane_project.git /opt/Feane_project
            else
              sudo git -C /opt/Feane_project fetch origin
              sudo git -C /opt/Feane_project reset --hard origin/main
            fi

            # Navigate to project directory
            cd /opt/Feane_project/feane-1.0.0

            # Build Docker image
            sudo docker build -t feane-project:${{ github.sha }} .

            # Remove old container
            sudo docker rm -f feane-container || true

            # Start new container
            sudo docker run -d \
              --name feane-container \
              --restart unless-stopped \
              -p 80:80 \
              feane-project:${{ github.sha }}

            echo "Deployment successful!"

            # Verify container
            sudo docker ps
            curl -f http://localhost
